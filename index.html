<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.N.A. Traders — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F1F5F9;--sidebar:#0F172A;--sidebar-hover:#1E293B;
  --primary:#1D4ED8;--primary-light:#2563EB;
  --surface:#FFFFFF;--border:#E2E8F0;
  --text:#0F172A;--muted:#64748B;
  --success:#059669;--warning:#D97706;--danger:#DC2626;
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px;}
#app{display:flex;height:100vh;}
/* SIDEBAR */
#sidebar{width:210px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;}
.sna-logo{padding:16px 16px 12px;border-bottom:1px solid #1E293B;}
.sna-logo .sn{font-size:13px;font-weight:700;color:#fff;}
.sna-logo .ss{font-size:11px;color:#475569;margin-top:2px;}
.nav{flex:1;padding:8px 0;overflow-y:auto;}
.nav-section{font-size:10px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.8px;padding:10px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;color:#94A3B8;font-size:13px;font-weight:500;transition:background .15s,color .15s;border-left:3px solid transparent;user-select:none;}
.nav-item:hover{background:var(--sidebar-hover);color:#E2E8F0;}
.nav-item.active{background:#172554;color:#93C5FD;border-left-color:#3B82F6;}
.nav-item .ni{font-size:15px;width:18px;flex-shrink:0;}
.sidebar-foot{padding:10px 16px;border-top:1px solid #1E293B;font-size:11px;color:#334155;text-align:center;}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#topbar .tn{font-weight:700;font-size:15px;}
.topbar-r{display:flex;align-items:center;gap:12px;}
.clk{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.sync-ok{background:#10b981;}.sync-ing{background:#f59e0b;}.sync-err{background:#ef4444;}.sync-off{background:#94a3b8;}
.sync-btn{padding:4px 10px;border:1px solid var(--border);border-radius:5px;background:var(--surface);font-size:11px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--muted);}
.sync-btn:hover{background:var(--bg);}
#content{flex:1;overflow-y:auto;padding:18px 22px;}
/* CARDS */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:16px 18px;}
.card-title{font-size:13px;font-weight:600;margin-bottom:13px;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:none;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-success{background:var(--success);color:#fff;}
.btn-warning{background:var(--warning);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--bg);}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-dg{background:#FEF2F2;color:var(--danger);border:1px solid #FECACA;}
/* FORMS */
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.1);}
.fg textarea{resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
/* TABLES */
.tbl-wrap{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead{background:#F8FAFC;}
th{padding:9px 13px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);}
td{padding:9px 13px;font-size:13px;border-bottom:1px solid #F1F5F9;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#F8FAFC;}
/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.bg-green{background:#D1FAE5;color:#065F46;}
.bg-amber{background:#FEF3C7;color:#92400E;}
.bg-red{background:#FEE2E2;color:#991B1B;}
.bg-blue{background:#DBEAFE;color:#1E40AF;}
.bg-purple{background:#EDE9FE;color:#5B21B6;}
.bg-cyan{background:#CFFAFE;color:#155E75;}
/* PAGE HEADER */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;}
.ph-title{font-size:18px;font-weight:700;}
.ph-actions{display:flex;align-items:center;gap:8px;}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:flex-start;gap:11px;}
.stat-icon{font-size:20px;margin-top:2px;}
.stat-val{font-size:21px;font-weight:800;line-height:1;}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--surface);border-radius:10px;width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-lg{width:660px;}.modal-sm{width:400px;}.modal-xl{width:780px;}
.mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.mh h3{font-size:15px;font-weight:700;}
.mclose{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:4px;}
.mclose:hover{background:var(--bg);}
.mb{padding:18px 20px;}
.mf{padding:13px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
/* POS */
.pos-wrap{display:grid;grid-template-columns:1fr 355px;gap:12px;height:calc(100vh - 88px);}
.pos-left{display:flex;flex-direction:column;gap:9px;min-height:0;}
.pos-searchbar{display:flex;gap:8px;}
.pos-searchbar input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;}
.pos-searchbar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.1);}
.pos-searchbar select{width:145px;padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;background:var(--surface);}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;flex:1;align-content:start;}
.prod-tile{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 11px;cursor:pointer;transition:border-color .15s,transform .1s;user-select:none;}
.prod-tile:hover{border-color:var(--primary);transform:translateY(-1px);}
.prod-tile .pn{font-size:12px;font-weight:600;line-height:1.3;}
.prod-tile .pc{font-size:11px;color:var(--muted);margin-top:1px;}
.prod-tile .pp{font-size:14px;font-weight:700;color:var(--primary);margin-top:5px;}
.prod-tile .ps{font-size:11px;margin-top:1px;}
/* CART */
.cart{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;}
.cart-head{padding:11px 13px;border-bottom:1px solid var(--border);flex-shrink:0;}
.cart-head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cart-head h3{font-size:13px;font-weight:700;}
.cust-row{display:flex;gap:6px;align-items:center;}
.cust-row select{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;outline:none;min-width:0;}
.add-cust-btn{padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:13px;flex-shrink:0;}
.cart-body{flex:1;overflow-y:auto;padding:7px;}
.cart-item{display:flex;align-items:center;gap:6px;padding:7px 8px;background:#F8FAFC;border-radius:6px;margin-bottom:5px;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-price{font-size:11px;color:var(--muted);}
.ci-qty{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.qbtn{width:21px;height:21px;border:1px solid var(--border);background:var(--surface);border-radius:4px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.qbtn:hover{background:var(--bg);}
.qi{width:34px;height:21px;text-align:center;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;padding:0;outline:none;}
.ci-total{font-size:12px;font-weight:700;color:var(--primary);min-width:52px;text-align:right;flex-shrink:0;}
.ci-del{color:var(--danger);cursor:pointer;font-size:15px;opacity:.5;}
.ci-del:hover{opacity:1;}
.cart-foot{padding:11px 13px;border-top:1px solid var(--border);flex-shrink:0;}
.sum-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;}
.sum-row.tot{font-size:16px;font-weight:800;border-top:1.5px solid var(--border);padding-top:7px;margin-top:3px;}
.disc-in{width:75px;padding:3px 7px;border:1px solid var(--border);border-radius:5px;font-size:12px;text-align:right;font-family:inherit;outline:none;}
.pay-sel,.pay-in{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--surface);outline:none;margin-bottom:6px;}
.ckbtn{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;}
.ckbtn:hover{background:var(--primary-light);}
.bal-hint{font-size:11px;margin-top:3px;font-weight:600;}
/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;background:var(--text);z-index:9999;animation:tIn .2s ease;pointer-events:none;}
@keyframes tIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
/* ALERT */
.alert{padding:10px 13px;border-radius:6px;font-size:13px;margin-bottom:13px;display:flex;align-items:center;gap:8px;}
.alert-w{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;}
.alert-r{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA;}
/* EMPTY */
.empty{text-align:center;padding:44px 20px;color:var(--muted);}
.ei{font-size:38px;margin-bottom:9px;}
/* PRINT */
#pf{display:none;}
@media print{
  @page{margin:3mm;size:80mm auto;}
  #app,#modal-root{display:none !important;}
  #pf{display:block !important;}
}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px;}
</style>
</head>
<body>
<div id="pf"></div>
<div id="app">
  <aside id="sidebar">
    <div class="sna-logo">
      <div class="sn">🏪 S.N.A. Traders</div>
      <div class="ss">Stationery Wholesale</div>
    </div>
    <nav class="nav">
      <div class="nav-section">Sales</div>
      <div class="nav-item active" data-page="dashboard"><span class="ni">📊</span> Dashboard</div>
      <div class="nav-item" data-page="pos"><span class="ni">💳</span> New Sale</div>
      <div class="nav-item" data-page="invoices"><span class="ni">🧾</span> Invoices</div>
      <div class="nav-section">Inventory</div>
      <div class="nav-item" data-page="products"><span class="ni">📦</span> Products</div>
      <div class="nav-item" data-page="stock"><span class="ni">📥</span> Stock In</div>
      <div class="nav-item" data-page="purchases"><span class="ni">🛒</span> Purchases / GRN</div>
      <div class="nav-section">People</div>
      <div class="nav-item" data-page="customers"><span class="ni">👥</span> Customers</div>
      <div class="nav-item" data-page="suppliers"><span class="ni">🏭</span> Suppliers</div>
      <div class="nav-section">Finance</div>
      <div class="nav-item" data-page="expenses"><span class="ni">💸</span> Expenses</div>
      <div class="nav-item" data-page="reports"><span class="ni">📈</span> Reports</div>
      <div class="nav-section">System</div>
      <div class="nav-item" data-page="settings"><span class="ni">⚙️</span> Settings</div>
    </nav>
    <div class="sidebar-foot">Built by Ak 🔥</div>
  </aside>
  <div id="main">
    <div id="topbar">
      <span id="tn">Dashboard</span>
      <div class="topbar-r">
        <span class="clk" id="clk-d"></span>
        <span class="clk" id="clk-t"></span>
        <button class="sync-btn" onclick="manualSync()">
          <span class="sync-dot sync-off" id="sync-dot"></span>
          <span id="sync-lbl">Offline</span>
        </button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="modal-root"></div>
<script>
// ═══ FIREBASE CONFIG ═══════════════════════════
let FB_URL = localStorage.getItem('sna_fb_url') || '';

// ═══ STORAGE ════════════════════════════════════
const K = {
  products:'sna_p', stock:'sna_s', invoices:'sna_i',
  customers:'sna_c', suppliers:'sna_sup', purchases:'sna_pur',
  expenses:'sna_exp', settings:'sna_cfg',
  invNum:'sna_n', grnNum:'sna_grn'
};
const db = {
  get: k => JSON.parse(localStorage.getItem(k) || '[]'),
  set: (k,v) => { localStorage.setItem(k, JSON.stringify(v)); fbPush(k,v); },
  getObj: (k,d={}) => JSON.parse(localStorage.getItem(k) || JSON.stringify(d)),
  setObj: (k,v) => { localStorage.setItem(k, JSON.stringify(v)); fbPush(k,v); }
};
function fbPush(k,v) {
  if (!FB_URL) return;
  fetch(`${FB_URL}/snapos/${k}.json`,{method:'PUT',body:JSON.stringify(v)}).catch(()=>{});
}
async function syncFromFB() {
  if (!FB_URL) { setSyncStatus('off'); return; }
  setSyncStatus('ing');
  try {
    const r = await fetch(`${FB_URL}/snapos.json`);
    if (!r.ok) throw new Error();
    const data = await r.json();
    if (data) Object.entries(data).forEach(([k,v]) => localStorage.setItem(k, JSON.stringify(v)));
    setSyncStatus('ok'); return true;
  } catch { setSyncStatus('err'); return false; }
}
async function manualSync() {
  const ok = await syncFromFB();
  if (ok) { toast('✅ Synced!'); go(curPage); }
  else toast('❌ Sync failed — check Firebase URL','err');
}
function setSyncStatus(s) {
  const dot=document.getElementById('sync-dot'), lbl=document.getElementById('sync-lbl');
  if(!dot) return;
  dot.className='sync-dot sync-'+s;
  lbl.textContent={ok:'Synced',ing:'Syncing…',err:'Error',off:'Offline'}[s]||s;
}
syncFromFB(); setInterval(syncFromFB, 5*60*1000);

// ═══ HELPERS ════════════════════════════════════
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const nextInv = () => { const n=parseInt(localStorage.getItem(K.invNum)||'0')+1; localStorage.setItem(K.invNum,n); fbPush(K.invNum,n); return `SNA-${String(n).padStart(4,'0')}`; };
const nextGRN = () => { const n=parseInt(localStorage.getItem(K.grnNum)||'0')+1; localStorage.setItem(K.grnNum,n); fbPush(K.grnNum,n); return `GRN-${String(n).padStart(4,'0')}`; };
const cfg = () => db.getObj(K.settings, {shopName:'S.N.A. Traders',address:'',phone:'',taxRate:0});
const fmt = n => 'Rs. ' + (parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => new Date(d).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});

// ═══ CLOCK ══════════════════════════════════════
function tick() {
  const now=new Date();
  const d=document.getElementById('clk-d'), t=document.getElementById('clk-t');
  if(d) d.textContent=now.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'});
  if(t) t.textContent=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tick,1000); tick();

// ═══ NAV ════════════════════════════════════════
const TITLES={dashboard:'Dashboard',pos:'New Sale',products:'Products',stock:'Stock In',purchases:'Purchases / GRN',suppliers:'Suppliers',invoices:'Invoices',customers:'Customers',expenses:'Expenses',reports:'Reports',settings:'Settings'};
let curPage='dashboard';
document.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click',()=>go(el.dataset.page)));
function go(page) {
  curPage=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
  document.getElementById('tn').textContent=TITLES[page]||page;
  document.getElementById('content').innerHTML=PAGES[page]?.()||'';
  AFTER[page]?.();
}
function modal(h){document.getElementById('modal-root').innerHTML=h;}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function toast(msg,type='ok'){
  const el=document.createElement('div');el.className='toast';
  el.style.background=type==='warn'?'#D97706':type==='err'?'#DC2626':'#0F172A';
  el.textContent=msg;document.body.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

// ═══ DASHBOARD ══════════════════════════════════
function pageDashboard() {
  const invs=db.get(K.invoices),prods=db.get(K.products),exps=db.get(K.expenses);
  const today=new Date().toDateString();
  const tInvs=invs.filter(i=>new Date(i.at).toDateString()===today);
  const tRev=tInvs.reduce((s,i)=>s+i.total,0);
  const totRev=invs.reduce((s,i)=>s+i.total,0);
  const totCost=db.get(K.purchases).reduce((s,p)=>s+p.total,0);
  const totExp=exps.reduce((s,e)=>s+e.amount,0);
  const low=prods.filter(p=>(p.stock||0)<=(p.minStock||5));
  const cred=invs.filter(i=>i.status!=='paid').reduce((s,i)=>s+(i.balance||0),0);
  return `
  <div class="stats-row">
    <div class="stat"><div class="stat-icon">💰</div><div><div class="stat-val">${fmt(tRev)}</div><div class="stat-lbl">Today's Revenue</div></div></div>
    <div class="stat"><div class="stat-icon">🧾</div><div><div class="stat-val">${tInvs.length}</div><div class="stat-lbl">Today's Bills</div></div></div>
    <div class="stat"><div class="stat-icon">📦</div><div><div class="stat-val">${prods.length}</div><div class="stat-lbl">Products</div></div></div>
    <div class="stat"><div class="stat-icon">⚠️</div><div><div class="stat-val">${low.length}</div><div class="stat-lbl">Low Stock</div></div></div>
  </div>
  ${low.length?`<div class="alert alert-w">⚠️ <strong>${low.length} item${low.length>1?'s':''} low/out of stock:</strong> ${low.map(p=>p.name).join(', ')}</div>`:''}
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:13px;">
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">All-time Revenue</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--success);">${fmt(totRev)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Total Purchases</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--primary);">${fmt(totCost)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Total Expenses</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--warning);">${fmt(totExp)}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:13px;">
    <div class="card"><div class="card-title">Recent Invoices</div>
      ${invs.length===0?`<div class="empty"><div class="ei">🧾</div><p>No sales yet</p></div>`:
        `<table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>

}
function renderProdGrid(prods) {
  if(!prods.length) return `<div class="empty"><div class="ei">📦</div><p>No products yet</p></div>`;
  return prods.map(p=>{
    const sc=p.stock<=0?'color:var(--danger)':p.stock<=(p.minStock||5)?'color:var(--warning)':'color:var(--success)';
    return `<div class="prod-tile" onclick="addToCart('${p.id}')"><div class="pn">${p.name}</div><div class="pc">${p.cat||''}${p.unit?' · '+p.unit:''}</div><div class="pp">${fmt(p.sell)}</div><div class="ps" style="${sc}">Stock: ${p.stock||0}</div></div>`;
  }).join('');
}
function posEnter(e) {
  if(e.key!=='Enter') return;
  const q=document.getElementById('ps-q').value.trim().toLowerCase();
  if(!q) return;
  const prods=db.get(K.products);
  const match=prods.find(p=>p.sku&&p.sku.toLowerCase()===q) || (prods.filter(p=>p.name.toLowerCase().includes(q)).length===1?prods.filter(p=>p.name.toLowerCase().includes(q))[0]:null);
  if(match) { addToCart(match.id); document.getElementById('ps-q').value=''; filterProds(); }
  else toast('⚠️ No exact match — keep typing or click product','warn');
}
function filterProds() {
  const q=document.getElementById('ps-q').value.toLowerCase();
  const cat=document.getElementById('ps-cat').value;
  const prods=db.get(K.products).filter(p=>(!q||p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q))&&(!cat||p.cat===cat));
  document.getElementById('prod-grid').innerHTML=renderProdGrid(prods);
}
function addToCart(id) {
  const p=db.get(K.products).find(x=>x.id===id); if(!p) return;
  if((p.stock||0)<=0){toast('⚠️ Out of stock!','warn');return;}
  const ex=cart.find(c=>c.id===id);
  if(ex){if(ex.qty>=p.stock){toast('⚠️ Not enough stock!','warn');return;}ex.qty++;}
  else cart.push({id,name:p.name,unit:p.unit||'pcs',price:parseFloat(p.sell||0),qty:1,maxQty:p.stock});
  renderCart();
}
function removeFromCart(id){cart=cart.filter(c=>c.id!==id);renderCart();}
function clearCart(){cart=[];renderCart();}
function setQty(id,val){const item=cart.find(c=>c.id===id);if(!item)return;const q=parseInt(val)||1;if(q<=0){removeFromCart(id);return;}if(q>item.maxQty){toast('⚠️ Max: '+item.maxQty,'warn');return;}item.qty=q;renderCart();}
function adjQty(id,d){const item=cart.find(c=>c.id===id);if(item)setQty(id,item.qty+d);}
function renderCart() {
  const body=document.getElementById('cart-body');if(!body)return;
  if(!cart.length){body.innerHTML=`<div class="empty" style="padding:28px 10px;"><div class="ei">🛒</div><p style="font-size:12px;">Tap products to add</p></div>`;}
  else{body.innerHTML=cart.map(c=>`
    <div class="cart-item">
      <div class="ci-info"><div class="ci-name">${c.name}</div><div class="ci-price">${fmt(c.price)} / ${c.unit}</div></div>
      <div class="ci-qty">
        <button class="qbtn" onclick="adjQty('${c.id}',-1)">−</button>
        <input class="qi" type="number" value="${c.qty}" min="1" max="${c.maxQty}" onchange="setQty('${c.id}',this.value)">
        <button class="qbtn" onclick="adjQty('${c.id}',1)">+</button>
      </div>
      <div class="ci-total">${fmt(c.price*c.qty)}</div>
      <span class="ci-del" onclick="removeFromCart('${c.id}')">×</span>
    </div>`).join('');}
  recalc();
}
function recalc() {
  const sub=cart.reduce((s,c)=>s+(c.price*c.qty),0);
  const disc=parseFloat(document.getElementById('cs-disc')?.value||0);
  const total=Math.max(0,sub-disc);
  const s=document.getElementById('cs-sub'),t=document.getElementById('cs-total');
  if(s)s.textContent=fmt(sub);if(t)t.textContent=fmt(total);
  const paid=parseFloat(document.getElementById('paid-amt')?.value||0);
  const hint=document.getElementById('bal-hint');
  if(hint&&paid>0){const diff=paid-total;hint.textContent=diff>=0?`Change: ${fmt(diff)}`:`Still Due: ${fmt(Math.abs(diff))}`;hint.style.color=diff>=0?'var(--success)':'var(--danger)';}
  else if(hint)hint.textContent='';
}
function togglePay(){const m=document.getElementById('pay-meth')?.value;const row=document.getElementById('pay-row');if(row)row.style.display=m==='credit'?'none':'block';}
function quickAddCust(){
  modal(`<div class="overlay"><div class="modal modal-sm">
    <div class="mh"><h3>➕ Quick Add Customer</h3><button class="mclose" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="fg"><label>Name *</label><input id="qcn" placeholder="Customer name" autofocus></div>
      <div class="fg"><label>Phone</label><input id="qcp" placeholder="07X XXX XXXX"></div>
    </div>
    <div class="mf"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveQuickCust()">Save & Select →</button></div>
  </div></div>`);
}
function saveQuickCust(){
  const name=document.getElementById('qcn').value.trim();
  if(!name){toast('⚠️ Name required!','warn');return;}
  const custs=db.get(K.customers);
  const nc={id:uid(),name,phone:document.getElementById('qcp').value.trim(),address:'',limit:0,credit:0,at:new Date().toISOString()};
  custs.push(nc);db.set(K.customers,custs);
  const sel=document.getElementById('cart-cust');
  if(sel){const opt=document.createElement('option');opt.value=nc.id;opt.textContent=nc.name+(nc.phone?' · '+nc.phone:'');sel.appendChild(opt);sel.value=nc.id;}
  closeModal();toast(`✅ ${name} added & selected!`);
}
function checkout(){
  if(!cart.length){toast('⚠️ Cart is empty!','warn');return;}
  const sub=cart.reduce((s,c)=>s+(c.price*c.qty),0);
  const disc=parseFloat(document.getElementById('cs-disc')?.value||0);
  const total=Math.max(0,sub-disc);
  const meth=document.getElementById('pay-meth')?.value||'cash';
  const paid=meth==='credit'?0:parseFloat(document.getElementById('paid-amt')?.value||total);
  const bal=Math.max(0,total-paid);
  const custId=document.getElementById('cart-cust')?.value;
  const custs=db.get(K.customers);const cust=custs.find(c=>c.id===custId);
  const prods=db.get(K.products);
  const inv={id:uid(),no:nextInv(),custId:custId||null,custName:cust?.name||'Walk-in',custPhone:cust?.phone||'',items:cart.map(c=>({...c})),sub,disc,total,paid,balance:bal,meth,status:bal<=0?'paid':paid>0?'partial':'credit',at:new Date().toISOString()};
  cart.forEach(ci=>{const p=prods.find(x=>x.id===ci.id);if(p)p.stock=Math.max(0,(p.stock||0)-ci.qty);});
  db.set(K.products,prods);
  if(cust&&bal>0){cust.credit=(cust.credit||0)+bal;db.set(K.customers,custs);}
  const invs=db.get(K.invoices);invs.push(inv);db.set(K.invoices,invs);
  cart=[];toast(`✅ ${inv.no} — Sale complete!`);
  showInvModal(inv);
}

function addPurItem(){
  const pid=document.getElementById('pi-prod').value;const qty=parseInt(document.getElementById('pi-qty').value);const cost=parseFloat(document.getElementById('pi-cost').value)||0;
  if(!pid||!qty||qty<=0){toast('⚠️ Select product & quantity','warn');return;}
  const prods=db.get(K.products);const p=prods.find(x=>x.id===pid);if(!p)return;
  const ex=purItems.find(i=>i.pid===pid);
  if(ex){ex.qty+=qty;ex.cost=cost;}
  else purItems.push({pid,name:p.name,unit:p.unit||'pcs',qty,cost});
  renderPurItems();
  document.getElementById('pi-qty').value='';document.getElementById('pi-cost').value='';
}
function removePurItem(pid){purItems=purItems.filter(i=>i.pid!==pid);renderPurItems();}
function renderPurItems(){
  const container=document.getElementById('pur-items-list');if(!container)return;
  const total=purItems.reduce((s,i)=>s+(i.qty*i.cost),0);
  if(!purItems.length){container.innerHTML='<div style="text-align:center;color:var(--muted);font-size:13px;padding:10px;">No items added yet</div>';document.getElementById('pur-total').value='';calcPurBal();return;}
  container.innerHTML=`<table style="width:100%;border-collapse:collapse;margin-bottom:10px;"><thead><tr><th>Product</th><th>Qty</th><th>Cost</th><th>Total</th><th></th></tr></thead><tbody>${purItems.map(i=>`<tr><td>${i.name}</td><td>${i.qty} ${i.unit}</td><td>${fmt(i.cost)}</td><td>${fmt(i.qty*i.cost)}</td><td><button class="btn btn-sm btn-dg" onclick="removePurItem('${i.pid}')">×</button></td></tr>`).join('')}</tbody></table>`;
  document.getElementById('pur-total').value=total.toFixed(2);calcPurBal();
}
function calcPurBal(){
  const total=parseFloat(document.getElementById('pur-total')?.value||0);const paid=parseFloat(document.getElementById('pur-paid')?.value||0);const bal=Math.max(0,total-paid);const el=document.getElementById('pur-bal-show');if(el)el.value=bal>0?`Balance: Rs. ${bal.toFixed(2)}`:'Fully Paid ✅';}
function savePurchase(){
  if(!purItems.length){toast('⚠️ Add at least one item','warn');return;}
  const supId=document.getElementById('pur-sup').value;const sups=db.get(K.suppliers);const sup=sups.find(s=>s.id===supId);
  const total=parseFloat(document.getElementById('pur-total').value)||0;const paid=parseFloat(document.getElementById('pur-paid').value)||0;const bal=Math.max(0,total-paid);
  const pur={id:uid(),grnNo:nextGRN(),supId:supId||null,supName:sup?.name||'Direct',items:[...purItems],total,paid,balance:bal,status:bal<=0?'paid':paid>0?'partial':'pending',note:document.getElementById('pur-note').value.trim(),date:document.getElementById('pur-date').value,at:new Date().toISOString()};
  const purs=db.get(K.purchases);purs.push(pur);db.set(K.purchases,purs);
  // Auto-update stock
  const prods=db.get(K.products);
  purItems.forEach(item=>{const p=prods.find(x=>x.id===item.pid);if(p)p.stock=(p.stock||0)+item.qty;});
  db.set(K.products,prods);
  // Update supplier balance
  if(sup&&bal>0){sup.balance=(sup.balance||0)+bal;db.set(K.suppliers,sups);}
  closeModal();go('purchases');toast(`✅ ${pur.grnNo} saved — stock updated!`);
}
function delPur(id){if(!confirm('Delete this purchase? Stock will NOT be reversed.'))return;db.set(K.purchases,db.get(K.purchases).filter(p=>p.id!==id));go('purchases');toast('🗑️ Purchase deleted');}

  const custs=db.get(K.customers);
  const data={name,phone:document.getElementById('cph').value.trim(),address:document.getElementById('ca').value.trim(),limit:parseFloat(document.getElementById('cl').value)||0,credit:parseFloat(document.getElementById('co').value)||0};
  if(id){const i=custs.findIndex(c=>c.id===id);if(i>=0)custs[i]={...custs[i],...data};}
  else custs.push({id:uid(),...data,at:new Date().toISOString()});
  db.set(K.customers,custs);closeModal();go('customers');toast(id?'✅ Customer updated!':'✅ Customer added!');
}
function delCust(id){if(!confirm('Delete?'))return;db.set(K.customers,db.get(K.customers).filter(c=>c.id!==id));go('customers');toast('🗑️ Deleted');}

// ═══ EXPENSES ═══════════════════════════════════
const EXP_CATS=['Rent','Electricity','Water','Transport','Staff Salary','Packaging','Maintenance','Miscellaneous'];
function pageExpenses(){
  const exps=db.get(K.expenses);
  const total=exps.reduce((s,e)=>s+e.amount,0);
  const thisMonth=new Date().toISOString().slice(0,7);
  const mTotal=exps.filter(e=>e.date.startsWith(thisMonth)).reduce((s,e)=>s+e.amount,0);
  return `<div class="ph"><div class="ph-title">Expenses</div>
  <button class="btn btn-primary" onclick="expModal()">+ Add Expense</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">This Month</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--warning);">${fmt(mTotal)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">All-time Total</div><div style="font-size:20px;font-weight:800;margin-top:4px;">${fmt(total)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Total Entries</div><div style="font-size:20px;font-weight:800;margin-top:4px;">${exps.length}</div></div>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr></thead>
    <tbody>${exps.length===0?`<tr><td colspan="5"><div class="empty"><div class="ei">💸</div><p>No expenses yet</p></div></td></tr>`:
      exps.slice().reverse().map(e=>`<tr><td style="font-size:12px;">${fmtDate(e.date)}</td><td><span class="badge bg-amber">${e.cat}</span></td><td>${e.desc||'—'}</td><td><strong>${fmt(e.amount)}</strong></td><td><button class="btn btn-sm btn-dg" onclick="delExp('${e.id}')">Del</button></td></tr>`).join('')}
    </tbody>
  </table></div>`;
}
function expModal(){
  modal(`<div class="overlay"><div class="modal modal-sm">
    <div class="mh"><h3>💸 Add Expense</h3><button class="mclose" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="fg"><label>Date *</label><input type="date" id="ex-date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="fg"><label>Category *</label><select id="ex-cat">${EXP_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="fg"><label>Description</label><input id="ex-desc" placeholder="Details about this expense..."></div>
      <div class="fg"><label>Amount (Rs.) *</label><input type="number" id="ex-amt" placeholder="0.00" min="0"></div>
    </div>
    <div class="mf"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-warning" onclick="saveExp()">💾 Save Expense</button></div>
  </div></div>`);
}
function saveExp(){
  const amt=parseFloat(document.getElementById('ex-amt').value);if(!amt||amt<=0){toast('⚠️ Enter valid amount!','warn');return;}
  const exps=db.get(K.expenses);
  exps.push({id:uid(),date:document.getElementById('ex-date').value,cat:document.getElementById('ex-cat').value,desc:document.getElementById('ex-desc').value.trim(),amount:amt,at:new Date().toISOString()});
  db.set(K.expenses,exps);closeModal();go('expenses');toast('✅ Expense saved!');
}
function delExp(id){if(!confirm('Delete this expense?'))return;db.set(K.expenses,db.get(K.expenses).filter(e=>e.id!==id));go('expenses');toast('🗑️ Deleted');}

// ═══ REPORTS ════════════════════════════════════
function pageReports(){
  const invs=db.get(K.invoices),prods=db.get(K.products),exps=db.get(K.expenses),purs=db.get(K.purchases);
  const totRev=invs.reduce((s,i)=>s+i.total,0);
  const totPur=purs.reduce((s,p)=>s+p.total,0);
  const totExp=exps.reduce((s,e)=>s+e.amount,0);
  const netProfit=totRev-totPur-totExp;
  const monthly={};
  invs.forEach(i=>{const m=new Date(i.at).toLocaleDateString('en-US',{year:'numeric',month:'short'});if(!monthly[m])monthly[m]={rev:0,count:0};monthly[m].rev+=i.total;monthly[m].count++;});
  const ps={};
  invs.forEach(i=>i.items.forEach(it=>{if(!ps[it.name])ps[it.name]={qty:0,rev:0};ps[it.name].qty+=it.qty;ps[it.name].rev+=it.price*it.qty;}));
  const top=Object.entries(ps).sort((a,b)=>b[1].rev-a[1].rev).slice(0,8);
  const expByCat={};
  exps.forEach(e=>{if(!expByCat[e.cat])expByCat[e.cat]=0;expByCat[e.cat]+=e.amount;});
  const low=prods.filter(p=>(p.stock||0)<=(p.minStock||5));
  return `<div class="ph"><div class="ph-title">Reports</div></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Total Revenue</div><div style="font-size:18px;font-weight:800;margin-top:4px;color:var(--success);">${fmt(totRev)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Total Purchases</div><div style="font-size:18px;font-weight:800;margin-top:4px;color:var(--primary);">${fmt(totPur)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Total Expenses</div><div style="font-size:18px;font-weight:800;margin-top:4px;color:var(--warning);">${fmt(totExp)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">Net Profit</div><div style="font-size:18px;font-weight:800;margin-top:4px;color:${netProfit>=0?'var(--success)':'var(--danger)'};">${fmt(netProfit)}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px;">
    <div class="card"><div class="card-title">📅 Monthly Sales</div>
      ${Object.keys(monthly).length===0?`<div class="empty"><div class="ei">📊</div><p>No data</p></div>`:
        `<table><thead><tr><th>Month</th><th>Revenue</th><th>Bills</th></tr></thead><tbody>${Object.entries(monthly).reverse().map(([m,d])=>`<tr><td>${m}</td><td><strong>${fmt(d.rev)}</strong></td><td>${d.count}</td></tr>`).join('')}</tbody></table>`}
    </div>
    <div class="card"><div class="card-title">🏆 Top Products</div>
      ${top.length===0?`<div class="empty"><div class="ei">📦</div><p>No sales</p></div>`:
        `<table><thead><tr><th>Product</th><th>Qty</th><th>Revenue</th></tr></thead><tbody>${top.map(([n,d])=>`<tr><td>${n}</td><td>${d.qty}</td><td>${fmt(d.rev)}</td></tr>`).join('')}</tbody></table>`}
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;">
    <div class="card"><div class="card-title">💸 Expenses by Category</div>
      ${Object.keys(expByCat).length===0?`<div class="empty"><div class="ei">💸</div><p>No expenses</p></div>`:
        `<table><thead><tr><th>Category</th><th>Total</th></tr></thead><tbody>${Object.entries(expByCat).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`<tr><td><span class="badge bg-amber">${c}</span></td><td><strong>${fmt(a)}</strong></td></tr>`).join('')}</tbody></table>`}
    </div>
    <div class="card"><div class="card-title">⚠️ Low / Out of Stock</div>
      ${low.length===0?`<div class="empty"><div class="ei">✅</div><p>All products well-stocked</p></div>`:
        `<table><thead><tr><th>Product</th><th>Stock</th><th>Min</th><th>Status</th></tr></thead><tbody>${low.map(p=>`<tr><td><strong>${p.name}</strong></td><td>${p.stock||0}</td><td>${p.minStock||5}</td><td><span class="badge ${(p.stock||0)<=0?'bg-red':'bg-amber'}">${(p.stock||0)<=0?'Out':'Low'}</span></td></tr>`).join('')}</tbody></table>`}
    </div>
  </div>`;
}

// ═══ SETTINGS ═══════════════════════════════════
function pageSettings(){
  const s=cfg();
  return `<div class="ph"><div class="ph-title">Settings</div></div>
  <div style="max-width:500px;display:flex;flex-direction:column;gap:13px;">
    <div class="card"><div class="card-title">🏪 Shop Information</div>
      <div class="fg"><label>Shop Name</label><input id="sn" value="${s.shopName}"></div>
      <div class="fg"><label>Address</label><textarea id="sa" rows="2">${s.address}</textarea></div>
      <div class="fg"><label>Phone</label><input id="sph" value="${s.phone}" placeholder="07X XXX XXXX"></div>
      <div class="fg"><label>Tax Rate (%)</label><input type="number" id="stx" value="${s.taxRate}" min="0" max="100"></div>
      <button class="btn btn-primary" onclick="saveSettings()">💾 Save Settings</button>
    </div>
    <div class="card"><div class="card-title">🔥 Firebase Sync (Multi-device)</div>
      <div class="fg"><label>Firebase Database URL</label><input id="fb-url" value="${FB_URL}" placeholder="https://your-project-default-rtdb.firebaseio.com"></div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">All 3 devices sync every 5 minutes. Use the 🔄 button in topbar to sync manually.</p>
      <div style="display:flex;gap:8px;"><button class="btn btn-primary" onclick="saveFBUrl()">💾 Save URL</button><button class="btn btn-ghost" onclick="testFB()">🔄 Test Connection</button></div>
    </div>
    <div class="card"><div class="card-title">💾 Data Backup</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="exportData()">📤 Export JSON</button>
        <button class="btn btn-ghost" onclick="document.getElementById('imp-f').click()">📥 Import JSON</button>
        <input type="file" id="imp-f" accept=".json" style="display:none;" onchange="importData(event)">
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:9px;">Export all data as backup. Import on any device to restore.</p>
    </div>
  </div>`;
}
function saveSettings(){db.setObj(K.settings,{shopName:document.getElementById('sn').value,address:document.getElementById('sa').value,phone:document.getElementById('sph').value,taxRate:parseFloat(document.getElementById('stx').value)||0});toast('✅ Settings saved!');}
function saveFBUrl(){const url=document.getElementById('fb-url').value.trim();FB_URL=url;localStorage.setItem('sna_fb_url',url);if(url){setSyncStatus('ing');syncFromFB().then(ok=>{if(ok)toast('✅ Firebase connected!');else toast('❌ Check URL & Firebase rules','err');});}else{setSyncStatus('off');toast('Firebase sync disabled');}}
async function testFB(){if(!FB_URL){toast('⚠️ Enter Firebase URL first','warn');return;}const ok=await syncFromFB();if(ok)toast('✅ Firebase connected! Data synced.');else toast('❌ Connection failed','err');}
function exportData(){const data={};Object.values(K).forEach(k=>{data[k]=JSON.parse(localStorage.getItem(k)||'[]');});const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sna-backup-${new Date().toISOString().split('T')[0]}.json`;a.click();toast('📤 Backup exported!');}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));toast('✅ Data imported!');go(curPage);}catch{toast('❌ Invalid file!','err');}};r.readAsText(f);}

// ═══ PAGE REGISTRY ═══════════════════════════════
const PAGES={dashboard:pageDashboard,pos:pagePOS,products:pageProducts,stock:pageStock,purchases:pagePurchases,suppliers:pageSuppliers,invoices:pageInvoices,customers:pageCustomers,expenses:pageExpenses,reports:pageReports,settings:pageSettings};
const AFTER={pos:()=>{cart=[];renderCart();}};

// ═══ BOOT ════════════════════════════════════════
go('dashboard');
</script>
</body>
</html>
